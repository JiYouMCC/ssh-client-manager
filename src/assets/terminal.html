<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e2e; }
    /* padding-top compensates for the QTabBar overlapping the content in documentMode */
    body { padding-top: var(--tab-overlap, 0px); }
    #terminal { width: 100%; height: 100%; }
  </style>
  <link rel="stylesheet" href="xterm.css">
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const wsPort = params.get('port');
    const bgColor  = params.get('bg')   || '#1e1e2e';
    const fgColor  = params.get('fg')   || '#cdd6f4';
    const fontFamily = decodeURIComponent(params.get('font_family') || 'Consolas%2C%20monospace');
    const fontSize = parseInt(params.get('font_size') || '12');
    const scrollback = parseInt(params.get('scrollback') || '10000');
    const cursorStyle = params.get('cursor') || 'block';

    // Apply tab bar overlap compensation
    const tabOverlap = parseInt(params.get('tab_overlap') || '0');
    if (tabOverlap > 0) {
      document.body.style.setProperty('--tab-overlap', tabOverlap + 'px');
    }

    // Parse 16-color palette if provided
    let palette = null;
    const paletteParam = params.get('palette');
    if (paletteParam) {
      try { palette = JSON.parse(decodeURIComponent(paletteParam)); } catch(e) {}
    }

    const termOptions = {
      fontFamily,
      fontSize,
      theme: { background: bgColor, foreground: fgColor },
      scrollback,
      cursorStyle,
      allowTransparency: false,
      convertEol: false,
    };
    if (palette && palette.length >= 16) {
      termOptions.theme.black        = palette[0];
      termOptions.theme.red          = palette[1];
      termOptions.theme.green        = palette[2];
      termOptions.theme.yellow       = palette[3];
      termOptions.theme.blue         = palette[4];
      termOptions.theme.magenta      = palette[5];
      termOptions.theme.cyan         = palette[6];
      termOptions.theme.white        = palette[7];
      termOptions.theme.brightBlack  = palette[8];
      termOptions.theme.brightRed    = palette[9];
      termOptions.theme.brightGreen  = palette[10];
      termOptions.theme.brightYellow = palette[11];
      termOptions.theme.brightBlue   = palette[12];
      termOptions.theme.brightMagenta= palette[13];
      termOptions.theme.brightCyan   = palette[14];
      termOptions.theme.brightWhite  = palette[15];
    }

    const term = new Terminal(termOptions);
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    let ws = null;
    let reconnectTimer = null;

    function connect() {
      if (!wsPort) {
        term.write('\r\n\x1b[31mNo WebSocket port provided.\x1b[0m\r\n');
        return;
      }
      ws = new WebSocket(`ws://127.0.0.1:${wsPort}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        // Send initial size
        sendResize();
      };

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) {
          term.write(new Uint8Array(e.data));
        } else {
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'title') {
              document.title = msg.value;
              window.dispatchEvent(new CustomEvent('terminal-title', { detail: msg.value }));
            }
          } catch (_) {
            term.write(e.data);
          }
        }
      };

      ws.onerror = () => {};
      ws.onclose = () => {
        term.write('\r\n\x1b[90m[disconnected]\x1b[0m\r\n');
      };
    }

    function sendResize() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    }

    term.onData(data => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(data);
      }
    });

    term.onResize(({ cols, rows }) => sendResize());

    term.onTitleChange(title => {
      if (title) document.title = title;
    });

    const resizeObserver = new ResizeObserver(() => {
      fitAddon.fit();
    });
    resizeObserver.observe(document.getElementById('terminal'));

    // Context menu: copy/paste via keyboard shortcut instead
    // Ctrl+Shift+C = copy, Ctrl+Shift+V = paste, Ctrl+=/−/0 = zoom
    let currentFontSize = fontSize;

    function applyFontSize(size) {
      currentFontSize = Math.max(6, Math.min(72, size));
      term.options.fontSize = currentFontSize;
      fitAddon.fit();
    }

    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== 'keydown') return true;
      if (e.ctrlKey && e.shiftKey && e.key === 'C') {
        const sel = term.getSelection();
        if (sel) navigator.clipboard.writeText(sel).catch(() => {});
        return false;
      }
      if (e.ctrlKey && e.shiftKey && e.key === 'V') {
        navigator.clipboard.readText().then(t => term.paste(t)).catch(() => {});
        return false;
      }
      // Zoom in: Ctrl+=  or Ctrl+Shift+=
      if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
        applyFontSize(currentFontSize + 1);
        return false;
      }
      // Zoom out: Ctrl+-
      if (e.ctrlKey && e.key === '-') {
        applyFontSize(currentFontSize - 1);
        return false;
      }
      // Reset zoom: Ctrl+0
      if (e.ctrlKey && e.key === '0') {
        applyFontSize(fontSize);
        return false;
      }
      return true;
    });

    // Ctrl+scroll to zoom
    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        applyFontSize(currentFontSize + (e.deltaY < 0 ? 1 : -1));
      }
    }, { passive: false });

    // Expose zoom controls for Python/Qt to call via runJavaScript
    window.termZoomIn  = () => applyFontSize(currentFontSize + 1);
    window.termZoomOut = () => applyFontSize(currentFontSize - 1);
    window.termZoomReset = () => applyFontSize(fontSize);

    // Returns pixel rect (in physical pixels) for the selected rows,
    // or null if nothing is selected.  Used by the Python screenshot feature.
    window.getSelectionPixelRect = function() {
      try {
        if (!term.hasSelection()) return null;
        var pos = term.getSelectionPosition ? term.getSelectionPosition() : null;
        if (!pos) return null;

        var core = term._core;
        var dims = (core._renderService && core._renderService.dimensions) ||
                   (core.renderService && core.renderService.dimensions);
        if (!dims) return null;
        var cellH = dims.actualCellHeight || (dims.css && dims.css.cell && dims.css.cell.height) || 16;

        var screen = document.querySelector('.xterm-screen');
        if (!screen) return null;
        var sr = screen.getBoundingClientRect();

        var viewport = document.querySelector('.xterm-viewport');
        var scrollTop = viewport ? viewport.scrollTop : 0;

        // Return CSS pixel values (no DPR scaling).
        // Python will scale by the pixmap's own devicePixelRatio.
        var startY = sr.top + pos.startRow * cellH - scrollTop;
        var endY   = sr.top + (pos.endRow + 1) * cellH - scrollTop;

        return {
          x: Math.round(sr.left),
          y: Math.round(startY),
          w: Math.round(sr.width),
          h: Math.round(endY - startY),
          dpr: window.devicePixelRatio || 1
        };
      } catch(e) { return null; }
    };

    window._savedSelectionRect = null;
    document.addEventListener('contextmenu', function() {
      window._savedSelectionRect = window.getSelectionPixelRect
        ? window.getSelectionPixelRect() : null;
    }, true);

    connect();
  </script>
</body>
</html>
