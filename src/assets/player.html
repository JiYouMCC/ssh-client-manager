<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <script src="xterm.js"></script>
  <link rel="stylesheet" href="xterm.css"/>
  <script src="xterm-addon-fit.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1e1e2e; overflow: auto; }
    /* The terminal wrapper scrolls when recorded size exceeds the window */
    #terminal { display: inline-block; min-width: 100%; min-height: 100%; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    var _cols = 80, _rows = 24;

    const term = new Terminal({
      theme: { background: '#1e1e2e', foreground: '#cdd6f4' },
      scrollback: 50000,
      convertEol: false,
      disableStdin: true,
      cursorBlink: false,
      cols: _cols,
      rows: _rows,
    });
    term.open(document.getElementById('terminal'));

    // Called from Python after header is parsed — fixes terminal to recorded dimensions.
    // No fitAddon: we never auto-resize so playback always matches the recording layout.
    function termSetSize(cols, rows) {
      _cols = cols; _rows = rows;
      term.resize(cols, rows);
    }

    function termWrite(text) { term.write(text); }

    function termReset() {
      term.reset();
      term.resize(_cols, _rows);
    }

    function termWriteBatch(texts) {
      for (var i = 0; i < texts.length; i++) { term.write(texts[i]); }
    }
  </script>
</body>
</html>
